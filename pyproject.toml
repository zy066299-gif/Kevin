[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "phase1-backtest"
version = "1.0.0"
description = "Bias-aware educational backtests for a fixed stock and ETF universe"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==2.5.3",
  "pandas==3.0.6",
  "matplotlib==3.11.2",
  "yfinance==1.7.0",
  "pyarrow==25.0.1"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

